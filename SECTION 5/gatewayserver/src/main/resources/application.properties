server.port=8888
spring.application.name=gatewayserver

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

spring.cloud.discovery.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=r1
spring.cloud.gateway.server.webflux.routes[0].uri=lb://COLLECTION
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/collections/**

spring.cloud.gateway.server.webflux.routes[1].id=r2
spring.cloud.gateway.server.webflux.routes[1].uri=lb://VETEMENT
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/vetements/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=unrestricted